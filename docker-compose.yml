services:
  postgres:
    image: postgres:17-alpine
    container_name: kopikala-db
    restart: always
    environment:
      POSTGRES_DB: kopikala
      POSTGRES_USER: kopikala
      POSTGRES_PASSWORD: kopikala
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
